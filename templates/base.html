{% load static %}
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Django Automator</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Bootstrap Icons CDN -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">

    <!-- Navbar Custom Styles -->
    <style>
        /* Glass effect for the navbar */
        .glass-nav {
            background: rgba(255, 255, 255, 0.9) !important;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }
        .nav-link {
            font-weight: 500;
            color: #495057 !important;
            transition: color 0.2s;
        }
        .nav-link:hover {
            color: #0d6efd !important;
        }
    </style>

    <!-- JS Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="{% static 'js/custom.js' %}"></script>
</head>

<body class="bg-light">
    
    <!-- Upgraded Premium Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light glass-nav sticky-top py-3 mb-4">
        <div class="container">
            <!-- Brand -->
            <a class="navbar-brand fw-bold d-flex align-items-center" href="{% url 'home' %}">
                <div class="bg-primary text-white rounded p-1 me-2 d-flex align-items-center justify-content-center" style="width: 32px; height: 32px;">
                    <i class="bi bi-cpu fs-5"></i>
                </div>
                <span style="letter-spacing: -0.5px; font-size: 1.3rem; color: #212529;">DjangoAutomator</span>
            </a>
            
            <!-- Mobile Toggle -->
            <button class="navbar-toggler border-0 shadow-none" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            
            <!-- Links and Buttons -->
            <div class="collapse navbar-collapse" id="navbarNav">
                <!-- Center Navigation Links -->
                <ul class="navbar-nav mx-auto mb-2 mb-lg-0">
                    <li class="nav-item px-2"><a class="nav-link" href="#">Features</a></li>
                    <li class="nav-item px-2"><a class="nav-link" href="#">Documentation</a></li>
                    <li class="nav-item px-2"><a class="nav-link" href="#">API</a></li>
                </ul>

                <!-- Right Side Auth & Repo -->
                <div class="d-flex align-items-center gap-3">
                    <a href="#" class="text-dark text-decoration-none fw-medium hover-primary" style="font-size: 0.95rem;">Log in</a>
                    <a href="#" class="btn btn-dark px-4 py-2 fw-semibold shadow-sm" style="font-size: 0.95rem; border-radius: 8px;">
                        Register
                    </a>
                </div>
            </div>
        </div>
    </nav>
    
    <!-- Main Content Block -->
    {% block content %}
    {% endblock %}

</body>
</html>
