

{% extends 'base.html' %}
{% block content %}
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">

                <div class="card shadow-sm border-0">
                    <div class="card-header bg-primary text-white py-3">
                        <h4 class="text-center mb-0">Import Data To Database</h4>
                    </div>

                    <div class="card-body p-4 bg-white">
                        
                        <form action="{% url 'import_data' %}" method="POST" enctype="multipart/form-data">
                            {% csrf_token %}

                            <!-- File Upload Field -->
                            <div class="mb-4">
                                <label for="file_path" class="form-label fw-semibold text-secondary">Upload CSV
                                    File</label>
                                <input type="file" name="file_path" id="file_path" class="form-control" accept=".csv"
                                    required>
                            </div>

                            <!-- Model Selection Field -->
                            <div class="mb-4">
                                <label for="model_name" class="form-label fw-semibold text-secondary">Select Database
                                    Table</label>
                                <select name="model_name" id="model_name" class="form-select" required>
                                    <option value="" disabled selected>-- Select a Table --</option>
                                    {% for model in model_list %}
                                    <option value="{{ model }}">{{ model }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <!-- Submit Button -->
                            <div class="d-grid mt-4">
                                <button type="submit" class="btn btn-primary btn-lg text-uppercase fw-bold shadow-sm">
                                    Import Data
                                </button>
                            </div>
                            {% include 'alerts.html' %}
                        </form>
                    </div>
                </div>

            </div>
        </div>
    </div>
     <!-- Bootstrap 5 JS Bundle (Includes Popper for dropdowns/tooltips) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
{% endblock %}
